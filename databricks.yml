bundle:
  name: tesco-bank-training-environment_cs

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-0e43ddc6-9583.cloud.databricks.com

resources:

  schemas:
    training_schema_bronze:
      name: "${workspace.current_user.short_name}_bronze"
      catalog_name: tesco_bank_training
    training_schema_silver:
      name: "${workspace.current_user.short_name}_silver"
      catalog_name: tesco_bank_training
    training_schema_gold:
      name: "${workspace.current_user.short_name}_gold"
      catalog_name: tesco_bank_training
    training_schema_sandbox:
      name: "${workspace.current_user.short_name}_sandbox"
      catalog_name: tesco_bank_training

  jobs:
    training_pipeline:
      name: "${workspace.current_user.short_name}_training_pipeline"

      parameters:
        - name: user_schema
          default: "${workspace.current_user.short_name}"

      tasks:
        - task_key: bronze_script
          notebook_task:
            notebook_path: ./src/bronze_ingest_CS.py
            source: WORKSPACE
            base_parameters:
              user_schema: "{{job.parameters.user_schema}}"

        - task_key: silver_script
          notebook_task:
            notebook_path: ./src/silver_clean_CS.py
            source: WORKSPACE
            base_parameters:
              user_schema: "{{job.parameters.user_schema}}"
          depends_on:
            - task_key: bronze_script

        - task_key: gold_script
          notebook_task:
            notebook_path: ./src/gold_aggregated_CS.py
            source: WORKSPACE
            base_parameters:
              user_schema: "{{job.parameters.user_schema}}"
          depends_on:
            - task_key: silver_script